document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ily:'Plus Jakarta Sans',sans-serif;color:#0F2A33\">\n\n  <!-- ============ TOP CHROME ============ -->\n  <sc-if value=\"{{ inApp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:sticky;top:0;z-index:40;width:100%;display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 20px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid #CCDBDF\">\n      <div onclick=\"{{ backToLaunch }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer\">\n        <img src=\"de134349-7309-45bd-a445-ac049b46a222\" alt=\"PhysioLekha\" style=\"height:30px;width:24px;display:block;object-fit:contain\">\n        <span style=\"font-weight:800;font-size:18px;letter-spacing:-0.02em\"><span style=\"color:#1170C2\">Physio<\u002Fspan><span style=\"color:#33A532\">Lekha<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;background:#E4EDEF;border-radius:11px;padding:4px;gap:2px\">\n        <button onclick=\"{{ goPatient }}\" style=\"border:none;cursor:pointer;border-radius:8px;padding:7px 16px;font-weight:700;font-size:13px;background:{{ segPatientBg }};color:{{ segPatientFg }}\">Patient app<\u002Fbutton>\n        <button onclick=\"{{ goDoctorAdmin }}\" style=\"border:none;cursor:pointer;border-radius:8px;padding:7px 16px;font-weight:700;font-size:13px;background:{{ segDoctorBg }};color:{{ segDoctorFg }}\">Doctor PMS<\u002Fbutton>\n        <button onclick=\"{{ goStaffPMS }}\" style=\"border:none;cursor:pointer;border-radius:8px;padding:7px 16px;font-weight:700;font-size:13px;background:{{ segStaffBg }};color:{{ segStaffFg }}\">Staff PMS<\u002Fbutton>\n        <button onclick=\"{{ goDocMobile }}\" style=\"border:none;cursor:pointer;border-radius:8px;padding:7px 16px;font-weight:700;font-size:13px;background:{{ segDocMobBg }};color:{{ segDocMobFg }}\">Doctor app<\u002Fbutton>\n        <button onclick=\"{{ goAdmin }}\" style=\"border:none;cursor:pointer;border-radius:8px;padding:7px 16px;font-weight:700;font-size:13px;background:{{ segAdminBg }};color:{{ segAdminFg }}\">Admin<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#5E7B85;font-weight:600\">{{ chromeLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ LAUNCHER ============ -->\n  <sc-if value=\"{{ showLaunch }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width:100%;max-width:1080px;padding:70px 28px 90px\">\n      <div style=\"display:flex;align-items:center;gap:13px;justify-content:center\">\n        <img src=\"de134349-7309-45bd-a445-ac049b46a222\" alt=\"PhysioLekha\" style=\"height:48px;width:39px;display:block;object-fit:contain\">\n        <span style=\"font-weight:800;font-size:34px;letter-spacing:-0.03em\"><span style=\"color:#1170C2\">Physio<\u002Fspan><span style=\"color:#33A532\">Lekha<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"text-align:center;font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-0.03em;margin:34px auto 0;max-width:760px\">Recover with a plan.<br><span style=\"color:#1170C2\">Track.<\u002Fspan> <span style=\"color:#33A532\">Heal.<\u002Fspan> <span style=\"color:#F47C1B\">Thrive.<\u002Fspan><\u002Fh1>\n      <p style=\"text-align:center;color:#46626B;font-size:18px;line-height:1.6;max-width:620px;margin:20px auto 0\">Find a physiotherapist near you, book online or in-clinic, follow your prescribed exercises and medicines — while your physio runs the whole practice from one dashboard.<\u002Fp>\n\n      <div style=\"display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-top:48px\">\n        <div onclick=\"{{ enterPatient }}\" style=\"cursor:pointer;width:340px;background:#fff;border:1px solid #DCE7EA;border-radius:24px;padding:30px;box-shadow:0 1px 2px rgba(16,42,51,.04),0 24px 50px -30px rgba(16,42,51,.4);transition:transform .15s\" style-hover=\"transform:translateY(-4px)\">\n          <div style=\"width:52px;height:52px;border-radius:15px;background:#E7F1FB;display:flex;align-items:center;justify-content:center;color:#1170C2\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:26px;height:26px\"><path d=\"M19 14c1.5-1.5 3-3.2 3-5.5A3.5 3.5 0 0 0 12 6 3.5 3.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-weight:800;font-size:22px;margin-top:18px;letter-spacing:-0.02em\">I'm a Patient<\u002Fdiv>\n          <div style=\"color:#5E7B85;font-size:14.5px;line-height:1.55;margin-top:8px\">Discover physios near you, book appointments, follow your plan and track progress.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:20px;color:#1170C2;font-weight:700;font-size:14.5px\">Open the patient app\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:18px;height:18px\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div onclick=\"{{ enterDoctor }}\" style=\"cursor:pointer;width:340px;background:#0F2A33;border:1px solid #0F2A33;border-radius:24px;padding:30px;box-shadow:0 1px 2px rgba(16,42,51,.04),0 24px 50px -30px rgba(16,42,51,.5);transition:transform .15s\" style-hover=\"transform:translateY(-4px)\">\n          <div style=\"width:52px;height:52px;border-radius:15px;background:rgba(51,165,50,.18);display:flex;align-items:center;justify-content:center;color:#62CC50\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:26px;height:26px\"><path d=\"M3 3v18h18\"><\u002Fpath><rect x=\"7\" y=\"11\" width=\"3\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"12\" y=\"7\" width=\"3\" height=\"10\" rx=\"1\"><\u002Frect><rect x=\"17\" y=\"13\" width=\"3\" height=\"4\" rx=\"1\"><\u002Frect><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-weight:800;font-size:22px;margin-top:18px;letter-spacing:-0.02em;color:#fff\">I'm a Physiotherapist<\u002Fdiv>\n          <div style=\"color:#9FB6BC;font-size:14.5px;line-height:1.55;margin-top:8px\">Run your clinic — token queue, scheduling, records, prescriptions, billing and analytics.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:20px;color:#62CC50;font-weight:700;font-size:14.5px\">Open the practice console\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:18px;height:18px\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px\">\n        <span onclick=\"{{ goDocMobile }}\" style=\"display:inline-flex;align-items:center;gap:9px;cursor:pointer;background:#0F2A33;color:#fff;border-radius:13px;padding:12px 20px;font-weight:700;font-size:13.5px;box-shadow:0 14px 30px -18px rgba(8,12,14,.7)\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#62CC50\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:17px;height:17px\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"><\u002Frect><path d=\"M11 18h2\"><\u002Fpath><\u002Fsvg>\n          Physiotherapist mobile app\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:15px;height:15px;opacity:.7\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span onclick=\"{{ enterStaffPMS }}\" style=\"display:inline-flex;align-items:center;gap:9px;cursor:pointer;background:#fff;color:#C9821E;border:1px solid #F6DCC0;border-radius:13px;padding:12px 20px;font-weight:700;font-size:13.5px\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C9821E\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:17px;height:17px\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"3.2\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11\"><\u002Fpath><\u002Fsvg>\n          Staff PMS\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:15px;height:15px;opacity:.7\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span onclick=\"{{ enterAdmin }}\" style=\"display:inline-flex;align-items:center;gap:9px;cursor:pointer;background:#11171A;color:#fff;border-radius:13px;padding:12px 20px;font-weight:700;font-size:13.5px;box-shadow:0 14px 30px -18px rgba(8,12,14,.7)\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5AA2E0\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:17px;height:17px\"><path d=\"M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n          Platform administrator\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:15px;height:15px;opacity:.7\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"text-align:center;color:#7A949B;font-size:12.5px;margin-top:22px\">Clickable prototype · sample data · physiolekha.in<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ LOGIN / REGISTER ============ -->\n  <sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:100%;max-width:460px;padding:54px 24px 80px\">\n      <div onclick=\"{{ backToLaunch }}\" style=\"display:flex;align-items:center;gap:10px;justify-content:center;cursor:pointer\">\n        <img src=\"de134349-7309-45bd-a445-ac049b46a222\" alt=\"PhysioLekha\" style=\"height:38px;width:31px;display:block;object-fit:contain\">\n        <span style=\"font-weight:800;font-size:24px;letter-spacing:-0.02em\"><span style=\"color:#1170C2\">Physio<\u002Fspan><span style=\"color:#33A532\">Lekha<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #DCE7EA;border-radius:22px;padding:26px;margin-top:26px;box-shadow:0 1px 2px rgba(16,42,51,.04),0 22px 48px -32px rgba(16,42,51,.4)\">\n        <sc-if value=\"{{ showRoleToggle }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;background:#EEF3F4;border-radius:12px;padding:4px;gap:3px\">\n            <button onclick=\"{{ roleToPatient }}\" style=\"flex:1;border:none;cursor:pointer;border-radius:9px;padding:10px;font-weight:700;font-size:13.5px;background:{{ rolePatientBg }};color:{{ rolePatientFg }};box-shadow:{{ rolePatientSh }}\">Patient<\u002Fbutton>\n            <button onclick=\"{{ roleToDoctor }}\" style=\"flex:1;border:none;cursor:pointer;border-radius:9px;padding:10px;font-weight:700;font-size:13.5px;background:{{ roleDoctorBg }};color:{{ roleDoctorFg }};box-shadow:{{ roleDoctorSh }}\">Physiotherapist<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isDoctorRole }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:10px\">\n            <div style=\"font-size:11.5px;font-weight:700;color:#3E5A63;margin-bottom:6px\">Sign in as<\u002Fdiv>\n            <div style=\"display:flex;background:#EEF3F4;border-radius:12px;padding:4px;gap:3px\">\n              <button onclick=\"{{ setDocRoleAdmin }}\" style=\"flex:1;border:none;cursor:pointer;border-radius:9px;padding:9px 6px;font-weight:700;font-size:12.5px;background:{{ lrAdminBg }};color:{{ lrAdminFg }};box-shadow:{{ lrAdminSh }};display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2\">Doctor-Admin<span style=\"font-size:9.5px;font-weight:600;color:#94A8B0\">Owner · full access<\u002Fspan><\u002Fbutton>\n              <button onclick=\"{{ setDocRoleStaff }}\" style=\"flex:1;border:none;cursor:pointer;border-radius:9px;padding:9px 6px;font-weight:700;font-size:12.5px;background:{{ lrStaffBg }};color:{{ lrStaffFg }};box-shadow:{{ lrStaffSh }};display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2\">Staff<span style=\"font-size:9.5px;font-weight:600;color:#94A8B0\">No billing / analytics<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isAdminRole }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;background:#11171A;border-radius:12px;padding:12px 14px;color:#fff\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5AA2E0\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:18px;height:18px;flex:none\"><path d=\"M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n            <div><div style=\"font-weight:800;font-size:12.5px\">Super Admin console<\u002Fdiv><div style=\"font-size:11px;color:#9FB6BC\">Restricted to platform staff<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"font-weight:800;font-size:21px;margin-top:22px;letter-spacing:-0.02em\">{{ authTitle }}<\u002Fdiv>\n        <div style=\"color:#5E7B85;font-size:13.5px;margin-top:4px\">{{ authSubtitle }}<\u002Fdiv>\n\n        <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:13px\">\n          <sc-if value=\"{{ isRegister }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:block\">\n              <span style=\"font-size:12.5px;font-weight:700;color:#3E5A63\">Full name<\u002Fspan>\n              <input defaultvalue=\"Aarav Shah\" style=\"width:100%;margin-top:6px;border:1px solid #D7E2E6;border-radius:11px;padding:12px 14px;font-size:14.5px;color:#0F2A33;background:#FAFCFC\">\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <label style=\"display:block\">\n            <span style=\"font-size:12.5px;font-weight:700;color:#3E5A63\">Email or phone<\u002Fspan>\n            <input defaultvalue=\"aarav@email.com\" style=\"width:100%;margin-top:6px;border:1px solid #D7E2E6;border-radius:11px;padding:12px 14px;font-size:14.5px;color:#0F2A33;background:#FAFCFC\">\n          <\u002Flabel>\n\n          <!-- Doctor registration number -->\n          <sc-if value=\"{{ showRegNo }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:block\">\n              <span style=\"font-size:12.5px;font-weight:700;color:#3E5A63\">Physiotherapy Council Registration No.<\u002Fspan>\n              <div style=\"position:relative;margin-top:6px\">\n                <input defaultvalue=\"IAP/2014/KA/04821\" style=\"width:100%;border:1px solid #B6D8C8;border-radius:11px;padding:12px 92px 12px 14px;font-size:14.5px;color:#0F2A33;background:#F1FAF5\">\n                <span style=\"position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;background:#E3F3DC;color:#2C8E26;font-weight:700;font-size:11px;padding:5px 9px;border-radius:8px\">\n                  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:12px;height:12px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Verified<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"display:block;font-size:11.5px;color:#5E7B85;margin-top:6px;line-height:1.5\">We verify this with your national / state council (IAP, HCPC, APTA, etc.) before your profile goes live.<\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display:block\">\n              <span style=\"font-size:12.5px;font-weight:700;color:#3E5A63\">Clinic name<\u002Fspan>\n              <input defaultvalue=\"Sunrise Physiotherapy &amp; Sports Clinic\" style=\"width:100%;margin-top:6px;border:1px solid #D7E2E6;border-radius:11px;padding:12px 14px;font-size:14.5px;color:#0F2A33;background:#FAFCFC\">\n            <\u002Flabel>\n            <div>\n              <span style=\"font-size:12.5px;font-weight:700;color:#3E5A63\">Choose your PMS plan<\u002Fspan>\n              <div style=\"display:flex;gap:9px;margin-top:7px\">\n                <div onclick=\"{{ regSetMonthly }}\" style=\"flex:1;cursor:pointer;border:1.5px solid {{ regMonthlyBd }};background:{{ regMonthlyBg }};border-radius:12px;padding:11px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between\"><span style=\"font-weight:800;font-size:13px\">Monthly<\u002Fspan><div style=\"width:15px;height:15px;border-radius:50%;border:2px solid {{ regMonthlyRing }};display:flex;align-items:center;justify-content:center\"><div style=\"width:7px;height:7px;border-radius:50%;background:{{ regMonthlyDot }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-weight:800;font-size:15px;margin-top:4px\">₹500<span style=\"font-size:11px;color:#5E7B85;font-weight:600\">/mo<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div onclick=\"{{ regSetYearly }}\" style=\"flex:1;cursor:pointer;border:1.5px solid {{ regYearlyBd }};background:{{ regYearlyBg }};border-radius:12px;padding:11px;position:relative\">\n                  <span style=\"position:absolute;top:-8px;right:8px;font-size:9px;font-weight:800;color:#fff;background:#2C8E26;padding:2px 7px;border-radius:20px\">2 mo free<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between\"><span style=\"font-weight:800;font-size:13px\">Yea :19px\"><path d=\"M19 12H5M11 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <span style=\"font-weight:800;font-size:16px\">Exercise {{ curEx.idx }} of {{ exTotal }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"padding:16px 18px 22px;flex:1\">\n      <!-- video panel -->\n      <div style=\"position:relative;height:218px;border-radius:20px;overflow:hidden;background:{{ curEx.bg }};display:flex;align-items:center;justify-content:center\">\n        <div style=\"position:absolute;width:150px;height:150px;border-radius:50%;background:{{ curEx.tint }};opacity:.16;animation:knBreathe 3.4s ease-in-out infinite\"><\u002Fdiv>\n        <div style=\"position:relative;width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -8px rgba(16,42,51,.35);color:{{ curEx.tint }}\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" style=\"width:26px;height:26px;margin-left:3px\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:absolute;left:14px;right:14px;bottom:14px\"><div style=\"height:5px;background:rgba(255,255,255,.55);border-radius:5px;overflow:hidden\"><div style=\"width:35%;height:100%;background:#fff;border-radius:5px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <span style=\"position:absolute;top:13px;left:14px;font-size:11px;font-weight:700;color:{{ curEx.tint }};background:#fff;padding:4px 10px;border-radius:8px\">{{ curEx.area }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"font-weight:800;font-size:20px;margin-top:16px;letter-spacing:-0.02em\">{{ curEx.name }}<\u002Fdiv>\n      <div style=\"display:flex;gap:9px;margin-top:12px\">\n        <div style=\"flex:1;background:#fff;border:1px solid #E6EDF0;border-radius:13px;padding:12px;text-align:center\"><div style=\"font-weight:800;font-size:17px\">{{ curEx.sets }}<\u002Fdiv><div style=\"font-size:11px;color:#5E7B85;margin-top:1px\">sets<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 n>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ PROGRESS ============ -->\n<sc-if value=\"{{ pProgress }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:8px 18px 26px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:6px\">\n      <div style=\"font-weight:800;font-size:22px;letter-spacing:-0.02em\">Progress<\u002Fdiv>\n      <div style=\"display:flex;background:#E9EFF1;border-radius:10px;padding:3px\">\n        <button onclick=\"{{ setWeek }}\" style=\"border:none;cursor:pointer;border-radius:8px;padding:7px 13px;font-weight:700;font-size:12.5px;background:{{ progWeekBg }};color:{{ progWeekFg }}\">Week<\u002Fbutton>\n        <button onclick=\"{{ setMonth }}\" style=\"border:none;cursor:pointer;border-radius:8px;padding:7px 13px;font-weight:700;font-size:12.5px;background:{{ progMonthBg }};color:{{ progMonthFg }}\">Month<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasMedMissed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#FDEEDD;border:1px solid #F6DCC0;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;margin-top:14px\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C9821E\" stroke-width=\"2\" style=\"width:17px;height:17px;flex:none\"><path d=\"M12 9v4M12 17h.01\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M10.3 4 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0Z\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:12px;color:#7A5418;line-height:1.45\">You have unlogged medicine today. Staying consistent keeps these charts accurate.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;gap:11px;margin-top:14px\">\n      <div style=\"flex:1;background:linear-gradient(135deg,#2C8E26,#33A532);border-radius:16px;padding:16px;color:#fff\">\n        <div style=\"font-size:12px;opacity:.9;font-weight:60 ze:13px;color:#0F2A33;background:#FAFCFC;min-height:60px;resize:vertical;line-height:1.5\">Reports reduced stiffness, mild soreness after wall squats. Pain 3/10 (was 6/10).<\u002Ftextarea><\u002Fdiv>\n      <div style=\"margin-top:14px\"><div style=\"font-size:12px;font-weight:700;color:#1170C2;margin-bottom:6px\">O — Objective<\u002Fdiv><textarea placeholder=\"Examination findings…\" style=\"width:100%;border:1px solid #D7E2E6;border-radius:11px;padding:12px;font-size:13px;color:#0F2A33;background:#FAFCFC;min-height:60px;resize:vertical;line-height:1.5\">Knee flexion 0–120°. Mild effusion. MMT quads 4/5. Valgus stress: mild laxity, no pain.<\u002Ftextarea><\u002Fdiv>\n      <div style=\"margin-top:14px\"><div style=\"font-size:12px;font-weight:700;color:#1170C2;margin-bottom:6px\">A — Assessment<\u002Fdiv><input defaultvalue=\"Grade II MCL sprain — resolving. Patellofemoral irritation.\" style=\"width:100%;border:1px solid #D7E2E6;border-radius:11px;padding:12px;font-size:13px;color:#0F2A33;background:#FAFCFC\"><\u002Fdiv>\n      <div style=\"margin-top:14px\"><div style=\"font-size:12px;font-weight:700;color:#1170C2;margin-bottom:6px\">P — Plan<\u002Fdiv><textarea placeholder=\"Treatment plan…\" style=\"width:100%;border:1px solid #D7E2E6;border-radius:11px;padding:12px;font-size:13px;color:#0F2A33;background:#FAFCFC;min-height:60px;resize:vertical;line-height:1.5\">Progress closed-chain loading. Continue HEP. Add proprioception. Review in 1 week. MRI if no improvement.<\u002Ftextarea><\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;margin-top:18px\">\n        <button onclick=\"{{ dBackFile }}\" style=\"border:none;cursor:pointer;background:#1170C2;color:#fff;border-radius:11px;padding:12px 18px;font-weight:700;font-size:13.5px;box-shadow:0 8px 18px -9px rgba(17,112,194,.8)\">Save &amp; sign<\u002Fbutton>\n        <button onclick=\"{{ dGoPrescribeEx }}\" style=\"border:1px solid #D7E2E6;cursor:pointer;background:#fff;color:#3E5A63;border-radius:11px;padding:12px 18px;font-weight:700;font-size:13.5px\">Prescribe exercises →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:#fff;border:1px solid #E6EDF0;border-radius:18px;padding:18px\">\n        <div style=\"font-weight:800;font-size:14px;margin-bottom:10px\">Vitals &amp; measures<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F2F6F7;font-size:13px\"><span style=\"color:#5E7B85\">Knee flexion<\u002Fspan><span style=\"font-weight:700\">120°<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F2F6F7;font-size:13px\"><span style=\"color:#5E7B85\">Quads strength<\u002Fspan><span style=\"font-weight:700\">4 / 5<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F2F6F7;font-size:13px\"><span style=\"color:#5E7B85\">Pain (VAS)<\u002Fspan><span style=\"font-weight:700;color:#33A532\">3 / 10<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;padding:8px 0;font-size:13px\"><span style=\"color:#5E7B85\">Swelling<\u002Fspan><span style=\"font-weight:700\">Mild<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E6EDF0;border-radius:18px;padding:18px\">\n        <div style=\"font-weight:800;font-size:14px;margin-bottom:10px\">Order tests<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"font-size:12px;font-weight:700;color:#1170C2;background:#E7F1FB;padding:7px 12px;border-radius:9px;cursor:pointer\">+ MRI knee<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;color:#3E5A63;background:#F0F4F5;padding:7px 12px;border-radius:9px;cursor:pointer\">+ X-Ray<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;color:#3E past 110°.<\u002Ftextarea><\u002Fdiv>\n      <div style=\"margin-top:14px\"><div style=\"font-size:12px;font-weight:700;color:#1170C2;margin-bottom:8px\">Core strength grade<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <span style=\"flex:1;text-align:center;font-size:12px;font-weight:700;color:#5E7B85;background:#F0F4F5;border:1px solid #E6EDF0;padding:8px;border-radius:9px;cursor:pointer\">Poor<\u002Fspan>\n          <span style=\"flex:1;text-align:center;font-size:12px;font-weight:700;color:#2C8E26;background:#E7F4E1;border:1.5px solid #33A532;padding:8px;border-radius:9px;cursor:pointer\">Fair<\u002Fspan>\n          <span style=\"flex:1;text-align:center;font-size:12px;font-weight:700;color:#5E7B85;background:#F0F4F5;border:1px solid #E6EDF0;padding:8px;border-radius:9px;cursor:pointer\">Good<\u002Fspan>\n          <span style=\"flex:1;text-align:center;font-size:12px;font-weight:700;color:#5E7B85;background:#F0F4F5;border:1px solid #E6EDF0;padding:8px;border-radius:9px;cursor:pointer\">Strong<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #E6EDF0;border-radius:18px;padding:22px\">\n      <div style=\"display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7C6CE0\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:18px;height:18px\"><path d=\"M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2\"><\u002Fpath><rect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1.5\"><\u002Frect><path d=\"M12 11h4M12 15h2M8 11h.01M8 15h.01\"><\u002Fpath><\u002Fsvg>Medical background<\u002Fdiv>\n      <p style=\"margin:5px 0 0;font-size:12px;color:#5E7B85\">Past history, known disease and medicines already prescribed.<\u002Fp>\n      <div style=\"margin-top:16px\"><div style=\"font-size:12px;font-weight:700;color:#3E5A63;margin-bottom:6px\">Past medical &amp; inju ">{{ q.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ===== DOC MOBILE · SCHEDULE ===== -->\n        <sc-if value=\"{{ mSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:4px 18px 24px\">\n            <div style=\"font-weight:800;font-size:20px;letter-spacing:-0.02em\">Schedule<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#5E7B85;margin-top:2px\">Today · {{ branchLabel }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px\">\n              <sc-for list=\"{{ mSched }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div onclick=\"{{ a.mopen }}\" style=\"background:#fff;border:1px solid #E6EDF0;border-radius:14px;padding:13px;display:flex;align-items:center;gap:12px;cursor:pointer\">\n                  <div style=\"font-weight:800;font-size:13px;color:#0F2A33;width:54px;flex:none\">{{ a.time }}<\u002Fdiv>\n                  <div style=\"width:38px;height:38px;border-radius:11px;background:{{ a.bg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none\">{{ a.initials }}<\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-weight:700;font-size:13.5px\">{{ a.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#5E7B85\">{{ a.for }}<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size:10.5px;font-weight:700;color:{{ a.modeFg }};background:{{ a.modeBg }};padding:4px 9px;border-radius:8px;flex:none\">{{ a.mode }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ===== DOC MOBILE · PATIENTS ===== -->\n        <sc-if value=\"{{ mPatients }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:4px 18px 24px\">\n            <div style=\"fo -size:12.5px;color:#3E5A63;line-height:1.5;margin-top:4px\">Telmisartan 40 · Metformin 500 · Ibuprofen 400 (SOS)<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:10px;margin-top:12px\">\n                <div style=\"flex:1;border:1px solid #E2F0DD;background:#F6FBF4;border-radius:14px;padding:13px\"><div style=\"font-size:10.5px;font-weight:700;color:#2C8E26;text-transform:uppercase;letter-spacing:.03em\">Core strengths<\u002Fdiv><div style=\"font-size:12px;color:#3E5A63;line-height:1.45;margin-top:5px\">Good quad activation, stable single-leg stance.<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;border:1px solid #F6DCC0;background:#FFF8F0;border-radius:14px;padding:13px\"><div style=\"font-size:10.5px;font-weight:700;color:#C9821E;text-transform:uppercase;letter-spacing:.03em\">Weaknesses<\u002Fdiv><div style=\"font-size:12px;color:#3E5A63;line-height:1.45;margin-top:5px\">Reduced terminal knee extension, VMO lag.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n\n              <button onclick=\"{{ mStartConsult }}\" style=\"width:100%;margin-top:14px;border:none;cursor:pointer;background:#1170C2;color:#fff;border-radius:13px;padding:14px;font-weight:700;font-size:14.5px;box-shadow:0 10px 22px -10px rgba(17,112,194,.7)\">Start consultation<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ===== DOC MOBILE · CONSULT ===== -->\n        <sc-if value=\"{{ mConsult }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 0 24px\">\n            <div style=\"position:sticky;top:0;z-index:6;background:rgba(243,247,248,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:11px;padding:6px 16px 12px\"><div onclick=\"{{ mBackFile }}\" style=\"width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid #E6EDF0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0F2A33\"><svg viewBox=\"0 0 24 24\" fill=\"no
